spring.application.name=imovelFacil
spring.datasource.url=jdbc:h2:mem:imoveis
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.data.web.pageable.max-page-size=100
spring.cache.type=caffeine
spring.cache.cache-names=properties
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m,recordStats
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,info,caches
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET
management.endpoints.access.default=read-only
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Im\u00f3vel F\u00e1cil API
info.app.version=@project.version@
springdoc.swagger-ui.path=/swagger-ui.html
